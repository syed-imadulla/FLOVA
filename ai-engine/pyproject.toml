[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udaan-engine"
version = "0.1.0"
description = "Self-salary rule, lean-week outlook and backtest for gig workers with irregular income"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["udaan_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
