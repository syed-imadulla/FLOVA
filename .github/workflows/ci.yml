name: FLOVA CI & Automated Security Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Enforce least-privilege permissions across all jobs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # Job 1: Security Audit & Secret Scanning
  # ===================================================================
  security-audit:
    name: Security Scans & Dependency Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FLOVA Repository Secret & Lockfile Scanner (SEC-08/SEC-11)
        run: node scripts/ci-security-scan.mjs

      - name: Frontend npm Dependency Security Audit
        run: npm --prefix frontend audit --audit-level=high

      - name: Backend npm Dependency Security Audit
        run: npm --prefix backend audit --audit-level=high

      - name: Setup Python 3.11 for pip-audit
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Python Dependency Vulnerability Audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          python -m pip_audit -r ai-engine/stt_service/requirements.txt

  # ===================================================================
  # Job 2: Backend Database Migrations & RLS Tests (PGlite WASM)
  # ===================================================================
  database-rls:
    name: Database Migrations & RLS Isolation
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_ANON_KEY: "mock_anon_key_ci"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Execute Database Migrations, RLS Isolation & Financial Checks (SEC-01/SEC-06)
        run: npm --prefix backend run test:db

      - name: Execute Edge Function Rate Limiter Unit Tests (SEC-03)
        run: npm --prefix backend run test:rate-limit

  # ===================================================================
  # Job 3: Supabase Edge Functions (Deno & TypeScript)
  # ===================================================================
  edge-functions:
    name: Edge Functions Deno & TypeScript
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_ANON_KEY: "mock_anon_key_ci"
      GROQ_API_KEY: "gsk_ci_mock_placeholder_key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno v2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend devDependencies
        run: npm --prefix backend ci

      - name: Check Edge Functions TypeScript Compilation
        run: npx --yes --package=typescript tsc --project backend/supabase/functions/tsconfig.json

      - name: Run Edge Function Rate Limiting & Streaming Hardening Tests (SEC-04)
        run: npm --prefix backend run test:deno

  # ===================================================================
  # Job 4: Frontend Build, Typechecks & Unit Tests
  # ===================================================================
  frontend:
    name: Frontend TypeScript, Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder_token_ci"
      VITE_GOOGLE_WEB_CLIENT_ID: "placeholder.apps.googleusercontent.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Services, Intent, Runway & WISH Unit Tests (SEC-10)
        run: npm --prefix frontend test

      - name: Compile Frontend Production Bundle (tsc + vite build)
        run: npm --prefix frontend run build

  # ===================================================================
  # Job 5: Python STT Service & Financial Engine (pytest)
  # ===================================================================
  python-stt:
    name: Python STT & Udaan Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-engine/pyproject.toml
            ai-engine/stt_service/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "ai-engine/[test]"
          pip install -r ai-engine/stt_service/requirements.txt

      - name: Run Python STT CORS & Engine pytest Suite (SEC-05)
        run: |
          PYTHONPATH=ai-engine python -m pytest ai-engine/tests

  # ===================================================================
  # Job 6: Android Debug & Unsigned Release Builds (SEC-09)
  # ===================================================================
  android-build:
    name: Android Debug & Unsigned Release Builds
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder_token_ci"
      VITE_GOOGLE_WEB_CLIENT_ID: "placeholder.apps.googleusercontent.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Compile frontend bundle for Capacitor
        run: npm --prefix frontend run build

      - name: Sync Capacitor Android assets
        run: |
          cd frontend
          npx cap sync android

      - name: Compile Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug

      - name: Compile Android Unsigned Release APK with R8 Optimization (SEC-09)
        run: |
          cd frontend/android
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleRelease
